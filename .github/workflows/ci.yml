name: CarRental CI Pipeline

# 1. Trigger
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên giao diện GitHub

# 2. Jobs
jobs:
  build:
    name: Build & Kiểm Tra Lỗi Code
    runs-on: ubuntu-latest

    steps:
      # Bước 2.1: Lấy mã nguồn
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      # Bước 2.2: Cài đặt .NET 8 SDK
      - name: 2. Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Bước 2.3: Tải các thư viện NuGet
      - name: 3. Restore Dependencies
        run: dotnet restore CarRentalSystem.sln

      # Bước 2.4: Biên dịch toàn bộ Solution
      - name: 4. Build Solution (Release Mode)
        run: dotnet build CarRentalSystem.sln --no-restore --configuration Release

