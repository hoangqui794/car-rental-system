name: CarRental Docker CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Chuyển tên repository thành chữ thường
        id: string
        run: |
          echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: 3. Đăng nhập vào GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5. Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}/carrental-api:latest

